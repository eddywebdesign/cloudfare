<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagina non trovata – Azienda Agricola Le Carpanelle</title>
<meta name="description" content="La pagina richiesta non esiste. Torna alla home di Azienda Agricola Le Carpanelle per scoprire olio, miele e il nostro B&B a Laterina Pergine Valdarno.">
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://www.lecarpanelle.it/">
<link rel="icon" type="image/png" href="https://www.lecarpanelle.it/immagini/favicon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
   --cream: #f5f0e8;
   --gold: #a07840;
   --gold-light: #c9a96e;
   --dark: #3F3F3F;
   --text: #3a3228;
   --muted: #7a6e60;
   --white: #faf8f5;
   --font-main: 'Jost', sans-serif;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: var(--font-main);
    background-color: var(--cream);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem 1.5rem;
  }

  .error-wrap { max-width: 34rem; }

  .error-icon { color: var(--gold); font-size: 2.6rem; margin-bottom: 1.4rem; }

  .error-code {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(3.5rem, 12vw, 6rem);
    font-weight: 300;
    line-height: 1;
    color: var(--dark);
    margin-bottom: 0.6rem;
  }

  .error-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(1.6rem, 4vw, 2.2rem);
    font-weight: 400;
    color: var(--dark);
    margin-bottom: 1rem;
  }

  .error-body {
    font-size: 0.98rem;
    font-weight: 300;
    line-height: 1.9;
    color: var(--muted);
    margin-bottom: 2.2rem;
  }

  .divider { width: 3rem; height: 1px; background: var(--gold); margin: 0 auto 2.2rem; }

  .error-actions { display: flex; flex-wrap: wrap; gap: 1rem; justify-content: center; }

  .btn {
    display: inline-block;
    font-size: 0.78rem;
    font-weight: 500;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    text-decoration: none;
    padding: 0.9rem 2rem;
    border-radius: 2px;
    transition: background 0.2s, color 0.2s;
  }

  .btn-primary { background: var(--gold-light); color: var(--dark); }
  .btn-primary:hover { background: var(--gold); color: #fff; }

  .btn-secondary { background: transparent; color: var(--dark); border: 1px solid var(--gold-light); }
  .btn-secondary:hover { background: var(--gold-light); color: var(--dark); }
</style>
</head>
<body>

<div class="error-wrap">
  <div class="error-icon"><i class="fa-solid fa-seedling"></i></div>
  <p class="error-code">404</p>
  <h1 class="error-title">Pagina non trovata</h1>
  <div class="divider"></div>
  <p class="error-body">
    La pagina che stai cercando non esiste o è stata spostata.<br>
    Torna alla home per scoprire il nostro olio extravergine, il miele artigianale e il Claudia B&amp;B nel cuore del Valdarno.
  </p>
  <div class="error-actions">
    <a class="btn btn-primary" href="/">Torna alla Home</a>
    <a class="btn btn-secondary" href="mailto:carpanelle@gmail.com">Contattaci</a>
  </div>
</div>

</body>
</html>
